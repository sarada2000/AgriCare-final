            pv_del_p: "இது உங்கள் கணக்கு, ஸ்கேன்கள், படங்கள், சிகிச்சைத் திட்டங்களை நிரந்தரமாக நீக்கும். உறுதிப்படுத்த உங்கள் கடவுச்சொல்லை உள்ளிடுங்கள்.",
            pv_pass: "கடவுச்சொல்", pv_del_btn: "என் கணக்கை நிரந்தரமாக நீக்கு",
            pv_del_done: "உங்கள் கணக்கும் தரவும் நீக்கப்பட்டன.", pv_del_login: "கணக்கை நீக்க முதலில் உள்நுழையுங்கள்."
        });

        function renderPrivacy() {
            const set = (id, key) => { document.getElementById(id).textContent = t(key); };
            set("pv-title", "pv_title"); set("pv-lead", "pv_lead");
            set("pv-del-t", "pv_del_t"); set("pv-del-p", "pv_del_p");
            set("pv-pass-l", "pv_pass"); set("pv-del-btn", "pv_del_btn");
            const list = document.getElementById("pv-list");
            list.innerHTML = "";
            for (let i = 1; i <= 7; i++) {
                const card = document.createElement("div");
                card.className = "pv-item";
                const h = document.createElement("h3"); h.textContent = t("pv_" + i + "t");
                const p = document.createElement("p"); p.textContent = t("pv_" + i);
                card.appendChild(h); card.appendChild(p);
                list.appendChild(card);
            }
        }
        document.addEventListener("agricare:lang", renderPrivacy);
        renderPrivacy();

        document.getElementById("pv-del-form").addEventListener("submit", async e => {
            e.preventDefault();
            const msg = document.getElementById("pv-msg");
            msg.textContent = "";
            if (!AgriAPI.token) { msg.textContent = t("pv_del_login"); return; }
            try {
                await AgriAPI.request("DELETE", "/api/auth/me", { password: document.getElementById("pv-pass").value });
                AgriAPI.logoutLocal();
                msg.style.color = "var(--accent)";
                msg.textContent = t("pv_del_done");
                setTimeout(() => { location.href = "login.html"; }, 1800);
            } catch (err) {
                msg.textContent = err.message;
            }
        });

    </script>

</body>
</html>
